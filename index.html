<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>CivCity</title>
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<link rel="stylesheet" href="style.css?v=2026101005">
</head>
<body>
<canvas id="game" aria-label="Карта города"></canvas>
<div id="labels"></div>

<!-- Слева сверху — карточка города со временем; рядом — значки того, что не так; справа — Легион и меню -->
<header id="hud">
  <div class="panel hud-city">
    <button type="button" class="city" id="city-btn" data-tip="city">
      <img id="emblem" alt="">
      <span class="city-text">
        <b id="city-name">Нова Рома</b>
        <small id="city-rank">Деревня</small>
        <span class="rank-bar"><span id="rank-bar"></span></span>
      </span>
    </button>
    <div class="city-stats">
      <button type="button" class="stat" id="st-pop" data-tip="pop" data-svg="people"><b id="v-pop">0</b></button>
      <button type="button" class="stat" id="st-happy" data-tip="happy" data-svg="smile"><b id="v-happy">—</b></button>
      <button type="button" class="stat warn" id="st-work" data-tip="workers" data-svg="hammer" hidden><b id="v-work">0</b></button>
    </div>
    <div class="time-row">
      <div class="date" data-tip="date"><b id="v-date">Год I</b><small id="v-season">весна</small></div>
      <div class="seg" role="group" aria-label="Скорость времени">
        <button type="button" data-speed="0" data-tip="speed0" data-svg="pause" aria-label="Пауза"></button>
        <button type="button" data-speed="1" data-tip="speed1" data-svg="play" aria-label="Скорость 1"></button>
        <button type="button" data-speed="2" data-tip="speed2" data-svg="fast" aria-label="Скорость 2"></button>
        <button type="button" data-speed="3" data-tip="speed3" data-svg="faster" aria-label="Скорость 3"></button>
      </div>
    </div>
  </div>
  <div id="alerts" aria-live="polite"></div>
  <div class="hud-right">
    <button type="button" id="legion-btn" class="pill-btn" data-tip="rail-legion" hidden><span data-svg="legion"></span><span>Легион</span><i class="badge" id="b-legion" hidden></i></button>
    <button type="button" id="home-btn" class="icon-btn round" data-tip="home" data-svg="home" aria-label="К городу"></button>
    <button type="button" id="menu-btn" class="icon-btn round" data-tip="menu" data-svg="menu" aria-label="Меню"><i class="badge" id="b-menu" hidden></i></button>
  </div>
</header>
<button type="button" id="show-ui" class="show-ui" data-svg="eye" aria-label="Показать интерфейс" title="Показать интерфейс (U)"></button>
<div id="menu-pop" class="panel menu-pop" hidden></div>

<!-- Задания — под карточкой города -->
<aside id="tasks" class="panel"></aside>

<!-- Советник: появляется облачком, когда есть что объяснить -->
<aside id="advisor" class="panel" hidden>
  <img class="portrait" id="adv-portrait" alt="">
  <div class="adv-body">
    <p class="eyebrow">Советник Марк</p>
    <p class="adv-title" id="adv-title"></p>
    <p class="adv-hint" id="adv-hint"></p>
    <div class="adv-btns">
      <button type="button" class="btn small ghost" id="adv-skip">Понятно</button>
      <button type="button" class="btn small" id="adv-action" hidden>Показать</button>
    </div>
  </div>
</aside>

<!-- Карточка выбранного здания -->
<div id="minimap" class="minimap collapsed"><canvas id="mm-canvas" aria-label="Карта города"></canvas><button type="button" id="mm-toggle" class="mm-toggle" data-svg="map" data-tip="map" aria-label="Показать карту"></button></div>

<!-- Справа внизу — казна, знания и Слава -->
<aside id="treasury" class="panel">
  <button type="button" class="tr-money" data-tip="money"><small>Казна</small><span class="tr-row"><span class="coin"></span><b id="v-money">0</b><small class="tr-cap" id="v-cap"></small></span><small id="v-income"></small></button>
  <div class="tr-sub">
    <button type="button" class="tr-chip" id="tr-scrolls" data-tip="rail-research"><span id="tr-scrolls-ico"></span><b id="v-scrolls">0</b><i class="badge" id="b-research" hidden></i><span class="tr-prog" id="tr-prog" hidden><span></span></span></button>
    <button type="button" class="tr-chip" id="tr-glory" data-tip="glory" hidden><span id="tr-glory-ico"></span><b id="v-glory">0</b></button>
  </div>
</aside>
<aside id="inspector" class="panel" hidden>
  <button type="button" id="insp-close" class="icon-btn" data-svg="close" aria-label="Закрыть"></button>
  <div id="insp-body"></div>
</aside>

<div id="toasts" aria-live="polite"></div>

<!-- Стройка -->
<footer id="dock">
  <div id="tool-hint" class="panel" hidden>
    <img id="hint-icon" alt="">
    <div class="hint-main"><b id="hint-name"></b><span id="hint-text"></span><span id="hint-status"></span></div>
    <button type="button" class="btn small ghost" id="hint-cancel">Отмена <kbd>Esc</kbd></button>
  </div>
  <div id="tray" class="panel" hidden><div id="tray-items" class="tray-items"></div></div>
  <div class="dock-bar">
    <nav id="tools-left" class="panel tools" aria-label="Мостовая"></nav>
    <nav id="cats" class="panel" aria-label="Постройки"></nav>
    <nav id="tools-right" class="panel tools" aria-label="Инструменты"></nav>
  </div>
</footer>

<div id="tooltip" role="tooltip" hidden></div>

<!-- Окно «Империя»: знания, товары, легион, чудеса, справка, журнал -->
<div id="win-back" hidden>
  <section id="win" class="panel" role="dialog" aria-modal="true" aria-labelledby="win-title">
    <header class="win-head">
      <h2 id="win-title">Империя</h2>
      <nav class="tabs" id="win-tabs"></nav>
      <button type="button" class="icon-btn" id="win-close" data-svg="close" aria-label="Закрыть"></button>
    </header>
    <div id="win-body"></div>
  </section>
</div>

<div id="modal-back" hidden><div id="modal" class="panel" role="dialog" aria-modal="true"></div></div>

<!-- ?v= — номер сборки: меняется при каждом обновлении, чтобы браузер не взял старые файлы из своего кэша.
     Three.js — модулем (importmap), остальные скрипты по порядку подключает js/boot.js -->
<script type="importmap">{ "imports": { "three": "./vendor/three-module/build/three.module.js" } }</script>
<script type="module" src="js/boot.js?v=2026101005"></script>
<script>setTimeout(() => { if (typeof Game === 'undefined') document.body.insertAdjacentHTML('beforeend', '<div class="fatal">Игра не запустилась: обновите браузер или страницу.</div>'); }, 15000);</script>
</body>
</html>
