<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Новый вид — витрина жителей</title>
<style>html, body { margin: 0; height: 100%; overflow: hidden; background: #d6e3e6; font: 14px system-ui, sans-serif; } canvas { display: block; width: 100%; height: 100%; }
.bar { position: fixed; left: 10px; top: 10px; display: flex; gap: 6px; } button { padding: 6px 12px; border-radius: 999px; border: 1px solid #c9b48a; background: #fffaf0; cursor: pointer; font-weight: 700; }</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="bar"><button id="walk">Идут</button><button id="idle">Стоят</button><button id="talk">Болтают</button></div>
<!-- Витрина запечённых жителей из assets/look2: тот же код, что в игре (js/look2.js), открывать с ?new -->
<script src="../vendor/three.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/util.js"></script>
<script src="../js/models.js"></script>
<script>const NEW_LOOK_PATH = '../';</script>
<script src="../js/look2.js"></script>
<script>
(async () => {
  const fetch0 = window.fetch;
  window.fetch = (u, o) => fetch0(String(u).startsWith('assets/') ? '../' + u : u, o);
  await Look2.load();
  const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
  r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping;
  r.shadowMap.enabled = true;
  const scene = new THREE.Scene(); scene.background = new THREE.Color('#d6e3e6');
  scene.add(new THREE.HemisphereLight('#fff4e2', '#6f7f52', 1.1));
  const sun = new THREE.DirectionalLight('#fff0d6', 2.6); sun.position.set(-3, 6, 4); sun.castShadow = true; scene.add(sun);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(20, 20).rotateX(-Math.PI / 2), new THREE.MeshLambertMaterial({ color: '#cdb98f' }));
  ground.receiveShadow = true; scene.add(ground);
  const cam = new THREE.PerspectiveCamera(30, 1, 0.05, 100);
  Look2.initCrowd(scene, 4);
  const n = Look2.crowd.length, list = [];
  const params = new URLSearchParams(location.search);
  const only = params.get('only');
  Look2.crowd.forEach((c, i) => {
    if (only && !c.v.name.includes(only)) return;
    list.push({ v2: i, wx: 0, wy: 0, yaw: 0, alpha: 1, seed: (i * 0.137) % 1, speed: 0.3, moving: true, role: 'x' });
  });
  list.forEach((w, i) => { w.wx = (i - (list.length - 1) / 2) * 0.24; });
  let mode = 'walk';
  document.getElementById('walk').onclick = () => mode = 'walk';
  document.getElementById('idle').onclick = () => { mode = 'idle'; list.forEach(w => w.seed = 0.5); };
  document.getElementById('talk').onclick = () => { mode = 'idle'; list.forEach(w => w.seed = 0.1); };
  window.VIEW = { list, cam, scene, r, setCam: (p, t) => { cam.position.set(...p); cam.lookAt(...t); } };
  VIEW.setCam([0, 0.45, 2.2], [0, 0.17, 0]);
  let last = performance.now();
  const tick = now => {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    list.forEach(w => { w.moving = mode === 'walk'; });
    Look2.drawWalkers(list, dt);
    r.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix();
    r.render(scene, cam);
    requestAnimationFrame(tick);
  };
  VIEW.step = s => { for (let t = 0; t < s; t += 1 / 30) { list.forEach(w => { w.moving = mode === 'walk'; }); Look2.drawWalkers(list, 1 / 30); } r.render(scene, cam); };
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
