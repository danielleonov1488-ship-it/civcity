<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Римский квартал — проверка</title>
<link rel="stylesheet" href="../vendor/fonts/fonts.css">
<style>
  :root { --paper: #f8f1e2; --ink: #45311f; --edge: #d6c39e; --terra: #b5452e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe3ee; font: 14px 'Nunito', system-ui, sans-serif; color: var(--ink); }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .bar { position: fixed; left: 12px; right: 12px; top: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; pointer-events: none; }
  .panel { pointer-events: auto; background: var(--paper); border: 1.5px solid var(--edge); border-radius: 12px; box-shadow: 0 6px 18px rgba(60, 38, 18, 0.2); padding: 8px 12px; }
  h1 { margin: 0; font: 700 22px 'Cormorant Garamond', Georgia, serif; }
  small { color: #85694f; font-weight: 700; }
  button { font: 800 13px 'Nunito', system-ui, sans-serif; color: var(--ink); background: #fffaf0; border: 1.5px solid var(--edge); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
  button.on { background: var(--terra); border-color: var(--terra); color: #fff; }
  #status { position: fixed; right: 12px; bottom: 12px; }
  #hint { position: fixed; left: 12px; bottom: 12px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="bar">
  <div class="panel"><h1>Римский квартал</h1><small>Здания Artisau + природа, предметы, жители и животные Quaternius</small></div>
  <div class="panel" id="views">
    <button data-v="city" class="on">Город</button>
    <button data-v="forum">Форум</button>
    <button data-v="street">Улица</button>
    <button data-v="farm">Ферма</button>
    <button id="sun">Вечер</button>
  </div>
</div>
<div class="panel" id="hint">Мышь: левая — вращать, правая — двигать, колесо — ближе/дальше</div>
<div class="panel" id="status">Загрузка…</div>
<script type="importmap">{ "imports": { "three": "../vendor/three-module/build/three.module.js" } }</script>
<script type="module" src="rome-test.js"></script>
</body>
</html>
